[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pymysql", "pymysql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alibabacloud_dypnsapi20170525.*", "alibabacloud_tea_openapi.*", "alibabacloud_tea_util.*", "darabonba.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
