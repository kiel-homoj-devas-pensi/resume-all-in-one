name: CI

on:
  push:
  pull_request:

jobs:
  domain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/resume_domain
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'
      - run: dart pub get --enforce-lockfile
      - run: git diff --exit-code --ignore-cr-at-eol -- pubspec.lock
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze
      - run: dart test

  storage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/local_storage
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'
      - run: dart pub get --enforce-lockfile
      - run: git diff --exit-code --ignore-cr-at-eol -- pubspec.lock
      - name: Require frozen generated files
        run: git ls-files --error-unmatch -- lib/src/database.g.dart drift_schemas/drift_schema_v4.json
      - run: dart run build_runner build
      - run: git diff --exit-code --ignore-cr-at-eol -- lib/src/database.g.dart
      - run: dart run drift_dev schema dump lib/src/database.dart drift_schemas
      - run: git diff --exit-code --ignore-cr-at-eol -- drift_schemas
      - name: Reject unfrozen generated files
        run: test -z "$(git ls-files --others --exclude-standard -- lib/src/database.g.dart drift_schemas)"
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze
      - run: dart test

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'
      - name: Agent protocol
        working-directory: packages/agent_protocol
        run: |
          dart pub get --enforce-lockfile
          git diff --exit-code --ignore-cr-at-eol -- pubspec.lock
          dart format --output=none --set-exit-if-changed lib test
          dart analyze
          dart test
      - name: Agent runtime
        working-directory: packages/agent_runtime
        run: |
          dart pub get --enforce-lockfile
          git diff --exit-code --ignore-cr-at-eol -- pubspec.lock
          dart format --output=none --set-exit-if-changed lib test
          dart analyze
          dart test
      - name: Model router
        working-directory: packages/model_router
        run: |
          dart pub get --enforce-lockfile
          git diff --exit-code --ignore-cr-at-eol -- pubspec.lock
          dart format --output=none --set-exit-if-changed lib test
          dart analyze
          dart test

  document-io:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/document_io
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'
      - run: dart pub get --enforce-lockfile
      - run: git diff --exit-code --ignore-cr-at-eol -- pubspec.lock
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze
      - run: dart test

  access-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/entitlements
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'
      - run: dart pub get --enforce-lockfile
      - run: git diff --exit-code --ignore-cr-at-eol -- pubspec.lock
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze
      - run: dart test

  agent-gateway:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: services/agent_gateway
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: services/agent_gateway/requirements-lock.txt
      - run: python -m pip install --requirement requirements-lock.txt
      - run: python -m pip check
      - run: python -m ruff format --check src tests scripts
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src tests scripts
      - run: python -m pytest
      - run: git ls-files --error-unmatch -- openapi/v0.10.json
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code --ignore-cr-at-eol -- openapi/v0.10.json

  flutter:
    runs-on: ubuntu-latest
    env:
      RESUME_ANDROID_SIGNING_PROPERTIES: ''
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.2'
      - run: java --version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code --ignore-cr-at-eol -- pubspec.lock
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - name: Compile Android instrumentation tests
        working-directory: apps/client/android
        run: ./gradlew :app:assembleDebugAndroidTest
